<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Post | AGEU</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />
  </head>
  <body>
    <div class="admin-form-container">
      <h2>Editar Post</h2>

      <form method="post" class="admin-form">
        <div class="input-group">
          <label for="title">Título</label>
          <input type="text" id="title" name="title" value="{{ post_to_edit.title }}" required />
        </div>

        <div class="input-group">
          <label for="content">Conteúdo</label>
          <div id="editor"></div>
          <input type="hidden" id="content" name="content" />
        </div>

        <div class="form-actions">
          <a href="{{ url_for('admin.admin_panel') }}" class="btn btn-secondary">Voltar</a>
          <button type="submit" class="btn btn-primary">Salvar Alterações</button>
        </div>
      </form>
    </div>

    <div id="existing-content" style="display:none;">{{ post_to_edit.content|safe }}</div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
      var quill = new Quill('#editor', {
        theme: 'snow',
        placeholder: 'Edite o conteúdo do seu post aqui...'
      })
      
      var existingContent = document.querySelector('#existing-content').innerHTML
      quill.root.innerHTML = existingContent
      
      var form = document.querySelector('form')
      form.onsubmit = function () {
        var contentInput = document.querySelector('input[name=content]')
        contentInput.value = quill.root.innerHTML
      }
    </script>
  </body>
</html>
